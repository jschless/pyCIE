site_name: pyCIE Workbook
site_description: Learn networking by implementing protocols in Python.

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: amber
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

docs_dir: docs

nav:
  - Home: index.md
  - Start Here: getting_started.md
  - Tutorial:
      - Course Map: tutorial/index.md
      - Chapter 1 - Packet Construction: tutorial/ch01_packet_construction.md
      - Chapter 2 - L2 Foundations: tutorial/ch02_switching_and_stp.md
      - Chapter 3 - L3 and Addressing: tutorial/ch03_l3_and_addressing.md
      - Chapter 4 - Transport and Policy: tutorial/ch04_transport_nat_acl_qos.md
      - Chapter 5 - Control Plane Depth: tutorial/ch05_control_plane_depth.md
      - Chapter 6 - Overlays and Security: tutorial/ch06_overlays_and_security.md
  - Reference:
      - Usage Guide: usage.md
      - Docs Site: docs_site.md
      - Architecture: architecture.md
      - Standards: standards.md
      - Visualization: visualization.md
      - Roadmap: roadmap.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/extra.css
