name: test

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "labs/**"
      - "pyproject.toml"
      - ".github/workflows/test.yml"
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/**"
      - "labs/**"
      - "pyproject.toml"
      - ".github/workflows/test.yml"
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run contract tests
        run: pytest -q

  exercise-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run exercise smoke suite
        run: pytest -q -m "exercise and (lab01 or lab06a or lab06b or lab06c or lab16 or lab27)"

  exercise-full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run full exercise suite
        run: pytest -q -m exercise
