[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycie"
version = "0.1.0"
description = "Protocol-first networking labs from CCNA to CCIE depth"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "pyCIE" }]
dependencies = []

[project.scripts]
pycie = "pycie.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q -m \"not exercise\""
markers = [
  "exercise: student lab tests to run during lab work",
  "lab01: Lab 01 learning switch",
  "lab02: Lab 02 spanning tree",
  "lab03: Lab 03 OSPF",
  "lab04: Lab 04 BGP",
  "lab05: Lab 05 LDP",
  "lab06: Lab 06 BFD",
  "lab07: Lab 07 IPv4 forwarding pipeline",
  "lab08: Lab 08 ARP behavior",
  "lab09: Lab 09 VLAN bridging",
  "lab10: Lab 10 RSTP behavior",
  "lab11: Lab 11 GRE tunnels",
  "lab12: Lab 12 IPsec tunnel mode",
  "lab13: Lab 13 BGP policy",
  "lab14: Lab 14 VRF and route leaking",
  "lab15: Lab 15 MPLS forwarding",
  "lab16: Lab 16 capstone multi-protocol convergence",
  "lab17: Lab 17 BGP FSM transport lifecycle",
  "lab18: Lab 18 OSPF multi-area ABR behavior",
  "lab23: Lab 23 IS-IS L1/L2 foundations",
  "lab30: Lab 30 route selection and redistribution",
  "lab31: Lab 31 ACL filtering",
  "lab32: Lab 32 AAA access control",
  "lab33: Lab 33 DHCP services",
  "lab34: Lab 34 multicast foundations",
  "lab35: Lab 35 VXLAN overlay data plane",
  "lab36: Lab 36 EVPN control plane",
  "lab37: Lab 37 MACsec link security",
  "lab38: Lab 38 control-plane databases",
  "lab39: Lab 39 RIB-to-FIB pipeline",
]
